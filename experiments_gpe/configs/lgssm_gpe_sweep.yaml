experiment:
  name: "lgssm_gpe_sweep"
  output_dir: "experiments_gpe/outputs/lgssm_gpe_sweep"
  seeds: [0, 1, 2, 3, 4]

model:
  type: "lgssm"
  state_dim: 8
  emission_dim: 4
  input_dim: 4
  has_dynamics_bias: true
  has_emissions_bias: true

data:
  T: 1000
  segment_length: 10
  u_max: 1.0
  Q_scale: 0.1
  R_scale: 0.1

train:
  algorithm: "sgd"
  num_iters: 200
  trainable_paths:
    - "dynamics.weights"
    - "dynamics.input_weights"
    - "dynamics.cov"
    - "emissions.weights"
    - "emissions.input_weights"
    - "emissions.cov"
    - "initial.mean"

methods:
  - name: "gpe"
    eps_cov: 0.35
    eps_step: 0.17
    num_cover_points: 256
    num_candidates: 8192
    probe_points: 8192
    amplitude: 1.0
  - name: "gaussian_white"
    sigma: 1.0

sweep:
  grid:
    data.T: [500, 1000, 2000]
    methods.gpe.eps_cov: [0.50, 0.35, 0.25]
    methods.gpe.eps_step: [0.35, 0.17]
